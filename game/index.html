<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — Open City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1218; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; z-index: 5; }
  #hud button { pointer-events: auto; cursor: pointer; }
  #hud.title-mode #top-left, #hud.title-mode #top-right, #hud.title-mode #objective-box,
  #hud.title-mode #speed-box, #hud.title-mode #minimap, #hud.title-mode #feed,
  #hud.title-mode #crosshair { display: none; }

  #top-left { position: absolute; top: 14px; left: 14px; }
  #health-bar { position: relative; width: 220px; height: 20px; background: rgba(10, 14, 20, 0.65); border: 1px solid rgba(255,255,255,0.35); border-radius: 4px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #58c96b; transition: width 0.2s; }
  #health-text { position: absolute; right: 6px; top: 1px; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #money { margin-top: 6px; font-size: 26px; font-weight: 800; color: #7ddb8a; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

  #top-right { position: absolute; top: 12px; right: 16px; }
  #stars { font-size: 30px; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  #stars .star { color: rgba(255,255,255,0.25); }
  #stars .star.on { color: #ffd75e; }
  #stars.hot .star.on { color: #ff5040; animation: starpulse 0.7s infinite alternate; }
  @keyframes starpulse { from { transform: scale(1); } to { transform: scale(1.15); } }

  #objective-box { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; background: rgba(10, 14, 20, 0.6); border-radius: 6px; padding: 8px 18px; max-width: 560px; }
  #objective { font-size: 17px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  #objective-dist { font-size: 13px; color: #ffd75e; font-weight: 600; }

  #speed-box { position: absolute; right: 18px; bottom: 18px; text-align: right; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  #speed { font-size: 44px; font-weight: 800; }
  #speed-unit { font-size: 15px; color: #cfd6de; margin-left: 4px; }

  #minimap { position: absolute; left: 14px; bottom: 14px; width: 200px; height: 200px; border: 2px solid rgba(255,255,255,0.45); border-radius: 8px; background: rgba(16,20,26,0.9); }

  #feed { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: 520px; text-align: center; }
  .feed-line { background: rgba(10, 14, 20, 0.7); border-radius: 5px; padding: 6px 12px; margin-top: 5px; font-size: 15px; display: inline-block; transition: opacity 0.6s; }
  .feed-line.fade { opacity: 0; }

  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 4px #000; display: none; }

  #vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(255,0,0,0); transition: box-shadow 0.1s; }
  #vignette.hit { box-shadow: inset 0 0 110px rgba(255,30,20,0.75); }

  #banner { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(0.9); text-align: center; opacity: 0; transition: opacity 0.25s, transform 0.25s; }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner-title { font-size: 42px; font-weight: 900; color: #ffd75e; text-shadow: 0 3px 10px rgba(0,0,0,0.85); letter-spacing: 1px; }
  #banner-sub { font-size: 18px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.85); }

  #floaters { position: absolute; inset: 0; overflow: hidden; }
  .floater { position: absolute; font-size: 19px; font-weight: 800; text-shadow: 0 2px 4px #000; transform: translate(-50%, -50%); opacity: 0; transition: transform 1s ease-out, opacity 1s; }
  .floater.rise { transform: translate(-50%, -160%); opacity: 1; }
  .floater.damage { color: #ff6a5e; }
  .floater.cash { color: #7ddb8a; }

  .screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 12, 18, 0.55); pointer-events: auto; }
  .screen.show { display: flex; }
  .panel { background: rgba(14, 18, 26, 0.92); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 28px 36px; max-width: 640px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
  .panel h1 { margin: 0 0 4px; font-size: 52px; letter-spacing: 4px; color: #ffd75e; text-shadow: 0 3px 12px rgba(0,0,0,0.6); }
  .tagline { color: #cfd6de; font-style: italic; margin: 0 0 14px; }
  #title-story p, #end-lines p { margin: 6px 0; color: #e8ecf0; font-size: 16px; line-height: 1.45; }
  .buttons { margin: 18px 0 6px; }
  .buttons button { background: #ffd75e; color: #1c1c22; border: none; border-radius: 6px; padding: 12px 26px; font-size: 17px; font-weight: 800; margin: 0 6px; }
  .buttons button:hover { background: #ffe98a; }
  .controls { margin-top: 16px; text-align: left; display: inline-block; }
  .control-row { display: flex; gap: 12px; font-size: 14px; color: #cfd6de; line-height: 1.7; }
  .control-row .key { display: inline-block; min-width: 110px; font-weight: 700; color: #fff; }

  #briefing { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); width: 560px; background: rgba(14, 18, 26, 0.9); border-left: 4px solid #ffd75e; border-radius: 6px; padding: 12px 16px; display: none; }
  #briefing.show { display: block; }
  #briefing-name { font-weight: 800; color: #ffd75e; margin-bottom: 4px; }
  #briefing-text { font-size: 15px; line-height: 1.45; color: #e8ecf0; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: drive, steal cars, dodge the police and finish Vera's three jobs"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
